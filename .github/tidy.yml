# A public sandbox, so everything runs on the cheapest model and outsiders get two tries a day.
triage:
  model: opencode-go/muse-spark-1.3-contributor

routes:
  - when: { kind: [spam] }
    action: ignore
  - when: { kind: [security] }
    action: security-notice
  - when: { kind: [question] }
    action: reply
    model: opencode-go/muse-spark-1.3-contributor
  - when: { kind: [bug, feature, docs] }
    action: fix
    model: opencode-go/muse-spark-1.3-contributor

review:
  model: opencode-go/muse-spark-1.3-contributor
  deep_model: opencode-go/muse-spark-1.3-contributor
  checks: ["bun install --frozen-lockfile", "bun run typecheck", "bun test"]

limits:
  outsider_attempts_per_day: 2
