# A public sandbox, so everything runs on a free model and outsiders get two tries a day.
# Free models on OpenCode Go are limited-time offers; switch to muse-spark-1.3-contributor if this one ends.
triage:
  model: opencode-go/iceman-contributor-free

routes:
  - when: { kind: [spam] }
    action: ignore
  - when: { kind: [security] }
    action: security-notice
  - when: { kind: [question] }
    action: reply
    model: opencode-go/iceman-contributor-free
  - when: { kind: [bug, feature, docs] }
    action: fix
    model: opencode-go/iceman-contributor-free

review:
  model: opencode-go/iceman-contributor-free
  deep_model: opencode-go/iceman-contributor-free
  checks: ["bun install --frozen-lockfile", "bun run typecheck", "bun test"]

limits:
  outsider_attempts_per_day: 2
